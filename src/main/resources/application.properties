spring.application.name=catbook-backend

# URL de conexão com o banco de dados (o banco se chamará catbook_db)
spring.datasource.url=jdbc:mysql://localhost:3306/catbook_db

# Credenciais do seu MySQL
spring.datasource.username=root
spring.datasource.password=root

# Configurações do Hibernate para criar as tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true